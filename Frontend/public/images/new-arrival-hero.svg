<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f08fb0"/>
      <stop offset="55%" stop-color="#b14a7b"/>
      <stop offset="100%" stop-color="#3c2a4a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- subtle vignette -->
  <radialGradient id="vign" cx="60%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.18"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vign)" />

  <!-- decorative circle -->
  <circle cx="1100" cy="460" r="160" fill="#ffffff22" />

  <!-- white product card -->
  <g transform="translate(820,310)" filter="url(#softShadow)">
    <rect x="0" y="0" width="360" height="360" rx="20" fill="#ffffff" />
    <!-- front panel -->
    <rect x="34" y="40" width="292" height="220" rx="12" fill="#eaf2ff" />
    <!-- screen area -->
    <rect x="60" y="64" width="90" height="56" rx="6" fill="#d3e6ff" />
    <rect x="160" y="64" width="110" height="56" rx="6" fill="#c9ddff" />
    <!-- small indicator lights -->
    <circle cx="76" cy="140" r="8" fill="#ff6b6b" />
    <circle cx="104" cy="140" r="8" fill="#ffd166" />
    <circle cx="132" cy="140" r="8" fill="#6bf08f" />
    <!-- text lines -->
    <rect x="60" y="180" width="200" height="12" rx="6" fill="#e6eefc" />
    <rect x="60" y="202" width="140" height="10" rx="6" fill="#eef6ff" />
  </g>

  <!-- product cable (decorative) -->
  <path d="M1180 560 C 1200 520, 1280 520, 1300 560" stroke="#ffffff66" stroke-width="18" stroke-linecap="round" fill="none" />

  <!-- overlay title (transparent dark so text readable) -->
  <g transform="translate(120,260)">
    <rect x="0" y="0" width="560" height="160" rx="12" fill="#ffffffcc" />
    <text x="28" y="56" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#111">New Arrivals</text>
    <text x="28" y="100" font-family="Inter, Arial, sans-serif" font-size="18" fill="#333">Fresh stock — only the best materials for your projects</text>
    <rect x="28" y="114" width="160" height="36" rx="8" fill="#c41e3a" />
    <text x="56" y="140" font-family="Inter, Arial, sans-serif" font-size="14" fill="#fff">Shop New Arrivals</text>
  </g>

</svg>